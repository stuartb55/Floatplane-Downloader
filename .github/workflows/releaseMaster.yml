name: "[master] Release"

on:
 push:
  branches:
   - "master"
  paths-ignore:
   - "**/*.md"
   - ".vscode/**"
   - "artwork/**"
   - "wiki/**"

jobs:
 Build:
  uses: ./.github/workflows/build.yml

 Release:
  name: Draft latest release on GitHub
  needs: Build
  runs-on: ubuntu-latest
  permissions:
   contents: write

  steps:
   - name: Download All Artifacts
     uses: actions/download-artifact@v4
     with:
      path: ./build/
      merge-multiple: true

   - name: Publish latest draft release on GitHub
     env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     run: |
      gh release delete latest --yes || true
      gh release create latest \
       --repo="${{ github.repository }}" \
       --title="Latest Release" \
       --generate-notes \
       --draft \
       build/*

 GitHub-Container-Registry:
  name: Publish latest build to GitHub Container Registry
  needs: Build
  runs-on: ubuntu-latest

  steps:
   - name: Set up QEMU
     uses: docker/setup-qemu-action@v3

   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v3

   - name: Login to GitHub Container Registry
     uses: docker/login-action@v3
     with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

   - name: Build & Publish latest on GitHub Container Registry
     uses: docker/build-push-action@v5
     with:
      push: true
      tags: ghcr.io/${{ github.repository_owner }}/floatplane-downloader:latest
      cache-from: type=gha
      cache-to: type=gha,mode=max
      platforms: linux/amd64,linux/arm64
