name: "[dev] Release"

on:
 push:
  branches:
   - "dev"
  paths-ignore:
   - "**/*.md"
   - ".vscode/**"
   - "artwork/**"
   - "wiki/**"

jobs:
 Build:
  uses: ./.github/workflows/build.yml

 Release:
  name: Release dev build on GitHub
  needs: Build
  runs-on: ubuntu-latest
  permissions:
   contents: write

  steps:
   - name: Checkout
     uses: actions/checkout@v5

   - name: Download All Artifacts
     uses: actions/download-artifact@v4
     with:
      path: ./build/
      merge-multiple: true

   - name: Publish dev release on GitHub
     env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     run: |
      gh release delete dev --yes || true
      gh release create dev \
       --repo="${{ github.repository }}" \
       --title="Latest Dev Build" \
       --notes="Automated dev build from commit ${{ github.sha }}" \
       --prerelease \
       build/*

 GitHub-Container-Registry:
  name: Publish dev build to GitHub Container Registry
  needs: Build
  runs-on: ubuntu-latest

  steps:
   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v3

   - name: Login to GitHub Container Registry
     uses: docker/login-action@v3
     with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

   - name: Set up QEMU
     uses: docker/setup-qemu-action@v3

   - name: Build & Publish dev on GitHub Container Registry
     uses: docker/build-push-action@v5
     with:
      push: true
      tags: ghcr.io/${{ github.repository_owner }}/floatplane-downloader:dev
      cache-from: type=gha
      cache-to: type=gha,mode=max
      platforms: linux/amd64,linux/arm64
